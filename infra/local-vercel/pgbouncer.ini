; PgBouncer for the TARGET=local-vercel rehearsal (ADR-0028): the stand-in for Neon's pooled URL.
; Transaction pooling like Neon's pooler, and no protocol-level prepared statement support
; (max_prepared_statements = 0, PgBouncer's default): stricter than Neon, so an app that works
; here never depends on a prepared statement outliving its transaction. Migrations bypass this
; and use the direct URL (lv-postgres, :5442 on the host), as `make deploy` does with Neon's unpooled URL.

[databases]
kitchentab_lv = host=lv-postgres port=5432 dbname=kitchentab_lv

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits
query_wait_timeout = 120
admin_users = kitchentab
