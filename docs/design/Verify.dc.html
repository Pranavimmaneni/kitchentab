<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enter your code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Work+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; font-family: 'Work Sans', sans-serif; color: {{c.ink}}; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 16px 10px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Signin.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{c.ink}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="flex: 1"></span>
    <button type="button" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}" style="width: 44px; height: 44px; border: 2px solid {{c.line}}; border-radius: 12px; background: {{c.paper}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></sc-if>
    </button>
  </header>

  <div style="flex: 1; padding: 10px 24px 28px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700">Check your inbox</h1>
      <span style="font-size: 15px; color: {{c.muted}}; line-height: 1.45">We sent a 6-digit code to <b style="color: {{c.ink}}">you@email.com</b>. It works for 10 minutes.</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
        <label style="display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{d.label}}</span>
          <input type="text" inputmode="numeric" maxlength="1" value="{{d.v}}" style="width: 100%; height: 60px; box-sizing: border-box; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{c.ink}}; text-align: center; font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; border-radius: 8px; padding: 0; box-shadow: {{d.shadow}}">
        </label>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Space Mono', monospace; font-size: 12px">
      <span style="color: {{c.muted}}">RESEND IN 0:24</span>
      <a href="Signin.dc.html" style="color: {{c.ink}}; font-weight: 700; min-height: 44px; display: flex; align-items: center">Use a different email</a>
    </div>

    <span style="flex: 1"></span>

    <a href="House.dc.html" style="text-decoration: none; background: {{c.accent2}}; color: {{c.onAccent2}}; border: 2px solid {{c.line}}; border-radius: 999px; min-height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 15px; box-shadow: 4px 4px 0 {{c.shadow}}">Verify →</a>
    <span style="font-size: 12px; color: {{c.muted}}; text-align: center">Codes auto-fill from email and SMS on most phones.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dark: null }; }
  renderVals() {
    const dark = this.state.dark !== null ? this.state.dark : (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#0D0D0B', paper: '#1A1A17', ink: '#F1EFE7', muted: '#A9A699', line: '#F1EFE7', faint: '#3A3933', shadow: '#7B61FF', accent: '#C6F432', accent2: '#C6F432', onAccent2: '#121210' }
      : { bg: '#ECEAE2', paper: '#FBFAF6', ink: '#121210', muted: '#5A5850', line: '#121210', faint: '#C9C6BB', shadow: '#121210', accent: '#C6F432', accent2: '#6A4CFF', onAccent2: '#FFFFFF' };
    const vals = ['4', '8', '2', '', '', ''];
    const digits = vals.map((v, i) => ({
      v, label: 'Digit ' + (i + 1),
      border: i === 3 ? c.line : (v ? c.line : c.faint),
      bg: v ? c.accent : c.paper,
      shadow: i === 3 ? '3px 3px 0 ' + c.shadow : 'none'
    }));
    digits.forEach((d) => { if (d.v) d.bg = c.paper; });
    digits[3].bg = c.accent;
    return {
      c, digits, isDark: dark, isLight: !dark,
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      toggleTheme: () => this.setState({ dark: !dark })
    };
  }
}
</script>
</body>
</html>
