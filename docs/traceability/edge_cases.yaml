# IDs for the edge-case rows of PRD §15 and §19.9 (ADR-0004). Every ID needs at least one test
# that carries it (pytest `@tid("EDGE-15-01")`, or a Vitest/Playwright title starting with it).
# `milestone` is where the behavior is built; check_traceability.py enforces an ID once that
# milestone is marked [done] in docs/PROGRESS.md.

prd_15:
  EDGE-15-01: {milestone: 5, area: Receipt, situation: "Photo is blurry, cut off or not a receipt"}
  EDGE-15-02: {milestone: 5, area: Receipt, situation: "Long receipt in 2-3 photos with overlapping lines"}
