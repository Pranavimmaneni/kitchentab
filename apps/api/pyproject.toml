[project]
name = "kitchentab-api"
version = "0.1.0"
description = "KitchenTab API, worker and local fake services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "authlib>=1.3",
  "joserfc>=1.0",
  "httpx>=0.27",
  "pywebpush>=2.0",
  "py-vapid>=1.9",
  "http-ece>=1.2",
  "cryptography>=43",
  "pyyaml>=6.0",
  "tzdata>=2024.1",  # zoneinfo data on Windows dev machines (house and user time zones)
  "pdfplumber>=0.11",
  "pypdf>=5.0",
  "vercel-queue[devserver]>=0.9.1",
  "vercel>=0.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "testcontainers[postgres,redis]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml",
  "pre-commit>=3.8",
  "pillow>=11.0",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions/*.py.tmpl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "DTZ", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT011", "ASYNC109", "ASYNC210", "B023"]  # B023: race lambdas are awaited in the same iteration
"migrations/versions/**" = ["E501"]
"fakeservices/**" = ["S105", "S106"]
"app/openapi.py" = ["S106"]  # throwaway values for schema generation only

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["arq.*", "authlib.*", "pywebpush.*", "py_vapid.*", "http_ece.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "id(test_id): TEST_PLAN ID(s) this test proves, e.g. id('SYNC-25')",
  "fr(*fr_ids): PRD FR IDs this test covers",
  "sync: concurrency/race tests run by make test-sync",
  "chaos: needs Toxiproxy or a long wait; run by make test-chaos (opt-in, see conftest)",
  "load: k6 / SSE load runs against several API instances; run by make test-load (opt-in, see conftest)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:testcontainers.*"]

[[tool.vercel.subscribers]]  # ADR-0013: outbox drain
entrypoint = "app.queues.outbox"
