# The mockup household (TEST_PLAN §2 "Scenario seeder"): `make seed SCENARIO=apt4b`.
#
# Reused by pytest (apps/api/tests), Playwright global setup and manual QA. Amounts follow the
# money fixtures, not the mockups' rounding (docs/design/README.md). The H Mart and Costco line
# items are not in any mockup; they were chosen so the reference compute_shares reproduces the
# mockup totals (H Mart $62.40 with Pranav owing $14.10; Costco settled) and the Tabs card nets to
# +$40.37 for Pranav (MONEY-08 / BAL-01). tests/test_seed.py checks all of that.
#
# Link tokens are derived from ids and timestamps (ADR-0018); `make seed` prints the links.
#
# Kitchen states (use soon, sharing, asks) are illustrative in the mockups. Where the §19.5 rules
# cannot produce a mockup label from the bill's purchase date, the item carries an explicit
# `stocked_on` / `shelf_life_days` override (agreed risk 27). KITCH-10 revisits this in Milestone 8.

